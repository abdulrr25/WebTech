<!DOCTYPE html>
<html>
<head>
    <title>jQuery Example</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

    <button class="btn">Start Fade-In</button>

    <p id="p1" style="display:none;">
        I will fade into view when the button is clicked!
    </p>

    <script>
        $(document).ready(function() {
            $(".btn").click(function(){
                $("#p1").fadeIn(1000); 
            });
        });
    </script>

</body>
</html>
