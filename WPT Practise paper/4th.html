<!DOCTYPE html>
<html>
<head>
  <title>Student Info</title>
</head>
<body>
  <h2>Enter Student Information</h2>
  <label>First Name:</label>
  <input type="text" id="firstName"><br><br>

  <label>Last Name:</label>
  <input type="text" id="lastName"><br><br>

  <label>Marks:</label>
  <input type="number" id="marks"><br><br>

  <button onclick="updateStudent()">Submit</button>

  <h3>Student Data:</h3>
  <p id="studentData"></p>

  <script>
    const stud = {
      firstName: "John",
      lastName: "",
      marks: 48
    };

    function updateStudent() {
      const fName = document.getElementById("firstName").value;
      const lName = document.getElementById("lastName").value;
      const mark = document.getElementById("marks").value;

      stud.firstName = fName;
      stud.lastName = lName;
      stud.marks = parseInt(mark);

      document.getElementById("studentData").innerText =
        `First Name: ${stud.firstName}\nLast Name: ${stud.lastName}\nMarks: ${stud.marks}`;
    }
  </script>
</body>
</html>
