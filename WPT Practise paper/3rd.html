<!DOCTYPE html>
<html>
<head>
  <title>Username Generator</title>
</head>
<body>
  <h2>Dynamic Username Generator</h2>
  <form id="userForm">
    <label>First Name:</label>
    <input type="text" id="firstName" required><br><br>
    
    <label>Last Name:</label>
    <input type="text" id="lastName" required><br><br>
    
    <label>Age:</label>
    <input type="number" id="age" required><br><br>
    
    <button type="submit">Generate Username</button>
  </form>

  <h3>Generated Username:</h3>
  <p id="usernameOutput"></p>

  <script>
    document.getElementById("userForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const age = document.getElementById("age").value.trim();

      if (firstName.length < 2 || lastName.length < 2 || !age) {
        alert("Please enter valid inputs.");
        return;
      }

      const username = firstName.slice(0, 2).toLowerCase() +
                       lastName.slice(-2).toLowerCase() +
                       age;

      document.getElementById("usernameOutput").textContent = username;
    });
  </script>
</body>
</html>
